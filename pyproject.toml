[project]
name = "qrcode-generator"
version = "0.1.0"
authors = [{ name = "Ernestor1337", email = "berezin.505@gmail.com" },{ name = "ilia2003", email= "fedorenkoilia@gmail.com"}]
description = "Qliqy | Qrcode-generator Service"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.124.2",
    "uvicorn==0.38.0",
    "qrcode[pil]==8.2",
    "loguru==0.7.3",
    "poethepoet==0.38.0",
    "faststream[rabbit]>=0.6.4",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "ruff==0.14.3",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# ignore = ["E501", "PLR0911", "PLR0912", "PLR0915", "PLR0913", "PLW2901"]
ignore = [
    "PLR0913",  # too many positional arguments for method call
    "PLW2901",  # overwritten argument in 'for' loop
]
select = [
    # flake8-bugbear
    "B",
    # pycodestyle
    "E",
    "W",
    "FAST",
    # pylint
    "PL",
    # pyflakes
    "F",
    # isort
    "I",
    # pydocstyle
#    "D",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true
[tool.poe]
envfile = [".env"]
verbosity = 1

[tool.poe.executor]
type = "virtualenv"
location = ".venv"

# formatting
[tool.poe.tasks.ruff-lint]
shell = "uv run ruff check --fix app"

[tool.poe.tasks.ruff-format]
shell = "uv run ruff format app"

[tool.poe.tasks.format]
sequence = [
    { ref = "ruff-lint" },
    { ref = "ruff-format" },
]

# start dev server
[tool.poe.tasks.dev]
cmd = "uvicorn --reload --use-colors --host 0.0.0.0 --port \"${port}\" --log-level debug app.main:app"
args = { port = { options = ["-p"], default = "8000" } }
